name: Enviar e-mails de reserva

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reservation-emails
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Enviar e-mails pendentes
        run: npm run send:reservation-emails
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BASILICA_EMAIL_SENDER_NAME: Basílica Santo Antônio de Pádua
          BASILICA_EMAIL_SENDER_EMAIL: pastoral@basilicasantoantonio.com.br
          BASILICA_ARTWORK_INTERNAL_EMAILS: 02.pastoral@diocesedelimeira.org.br,basilicasantoantonio.nog@gmail.com,basilicasantoantonio@gmail.com
